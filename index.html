<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HoneyLeague TCG - Torneio & Chaves Suíço</title>
<meta name="description" content="Gerenciador de torneios em sistema suíço para TCG com OMW% e OOW% automáticos, chaves por rodada, metagame, confrontos diretos, histórico, ranking e decklists com imagens.">
<meta property="og:title" content="HoneyLeague TCG - Torneio & Chaves Suíço">
<meta property="og:description" content="Chaves, classificação com OMW%/OOW%, metagame, histórico e ranking da liga.">
<meta name="theme-color" content="#F59E0B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: barra fixa com marca e 5 páginas; conteúdo até 1280px; cartões arredondados no padrão âmbar do app original. */
/* Layout: barra fixa com marca e 6 páginas; conteúdo até 1280px. Paleta: branco + amarelo (claro) e preto + amarelo (escuro).
   Regras do UI/UX Pro Max: contraste AA, alvos de toque 44px no celular, foco visível, tokens de elevação/movimento, sem emoji como ícone. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#FFFBEB; --raise:#FFFFFF; --line:#F0E6C8; --line-strong:#E2CF8F;
  --ink:#1C1917; --ink-strong:#0A0A0A; --muted:#57534E; --faint:#78716C;
  --honey:#FACC15; --honey-strong:#854D0E; --honey-soft:#FEF9C3; --on-honey:#0A0A0A;
  --win:#047857; --win-soft:#ECFDF5; --loss:#BE123C; --loss-soft:#FFF1F2; --tie:#4338CA; --tie-soft:#EEF2FF;
  --admin:#0A0A0A; --on-admin:#FACC15; --overlay:rgba(10,10,10,.55);
  --e1:0 1px 2px rgba(10,10,10,.06); --e2:0 1px 2px rgba(10,10,10,.05),0 6px 18px -10px rgba(10,10,10,.18); --e3:0 24px 64px -16px rgba(10,10,10,.35);
  --shadow:var(--e2);
  --t-fast:150ms; --t:220ms; --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.4,0,1,1);
  --z-nav:30; --z-modal:60; --z-toast:90;
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --surface:#141414; --sunk:#1B1B1B; --raise:#232323; --line:#2A2A2A; --line-strong:#3D3D3D;
  --ink:#F5F5F4; --ink-strong:#FFFFFF; --muted:#A8A29E; --faint:#8C8782;
  --honey:#FACC15; --honey-strong:#FDE047; --honey-soft:#2A2306; --on-honey:#0A0A0A;
  --win:#34D399; --win-soft:#06281D; --loss:#FB7185; --loss-soft:#33101A; --tie:#A5B4FC; --tie-soft:#1E1B4B;
  --admin:#FACC15; --on-admin:#0A0A0A; --overlay:rgba(0,0,0,.72);
  --e1:0 1px 2px rgba(0,0,0,.5); --e2:0 1px 2px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.9); --e3:0 24px 64px -16px rgba(0,0,0,.9);
  --shadow:var(--e2); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#141414; --sunk:#1B1B1B; --raise:#232323; --line:#2A2A2A; --line-strong:#3D3D3D;
  --ink:#F5F5F4; --ink-strong:#FFFFFF; --muted:#A8A29E; --faint:#8C8782;
  --honey:#FACC15; --honey-strong:#FDE047; --honey-soft:#2A2306; --on-honey:#0A0A0A;
  --win:#34D399; --win-soft:#06281D; --loss:#FB7185; --loss-soft:#33101A; --tie:#A5B4FC; --tie-soft:#1E1B4B;
  --admin:#FACC15; --on-admin:#0A0A0A; --overlay:rgba(0,0,0,.72);
  --e1:0 1px 2px rgba(0,0,0,.5); --e2:0 1px 2px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.9); --e3:0 24px 64px -16px rgba(0,0,0,.9);
  --shadow:var(--e2); color-scheme:dark}

*{box-sizing:border-box}
html{font-size:14.5px;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
::selection{background:var(--honey);color:var(--on-honey)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;color:var(--ink-strong);text-wrap:balance}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px;border-radius:8px;box-shadow:0 0 0 5px color-mix(in srgb,var(--ink-strong) 70%,transparent)}
.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:14px;height:14px}.i.lg{width:20px;height:20px}.i.xl{width:28px;height:28px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* navbar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-row{display:flex;align-items:center;gap:10px;min-height:54px;padding-block:6px;min-width:0}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink-strong);border:0;background:none;padding:0}
.brand .pot{width:32px;height:32px;border-radius:10px;background:var(--honey-soft);display:grid;place-items:center;font-size:20px}
.brand b{font-family:var(--f-display);font-size:1.05rem;font-weight:700;white-space:nowrap}
.brand{flex:none}
.pages{display:flex;gap:2px;margin-left:4px;min-width:0;overflow:hidden}
.pages button{display:flex;align-items:center;gap:5px;border:0;background:none;border-radius:10px;padding:7px 9px;font-weight:700;font-size:.8rem;color:var(--muted);white-space:nowrap}
.pages button:hover{color:var(--ink-strong);background:var(--sunk)}
.pages button[aria-current="page"]{background:var(--honey-soft);color:var(--honey-strong)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:.68rem;font-weight:800;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.honey{background:var(--honey-soft);color:var(--honey-strong)}
.pill.win{background:var(--win-soft);color:var(--win)}
.pill.loss{background:var(--loss-soft);color:var(--loss)}
.pill.tie{background:var(--tie-soft);color:var(--tie)}
.nav-tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.chip-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 10px;font-weight:700;font-size:.78rem;white-space:nowrap}
.chip-btn:hover{background:var(--sunk)}
.mobile-pages{display:none;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.mobile-pages::-webkit-scrollbar{display:none}
.mobile-pages button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:12px;padding:6px 10px;font-size:.7rem;font-weight:800;color:var(--muted)}
.mobile-pages button[aria-current="page"]{background:var(--honey-soft);color:var(--honey-strong)}
@media (max-width:1180px){.nav-tools .hide-sm{display:none!important}}
@media (max-width:900px){.pages{display:none}.mobile-pages{display:flex}.hide-sm{display:none!important}}
.adminbar{background:var(--admin);color:var(--on-admin);font-size:.78rem;font-weight:600}
.adminbar .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-block:7px}
.adminbar button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:800;padding:0}
.visitbar{background:var(--tie-soft);color:var(--tie);font-size:.78rem;font-weight:700}
.visitbar .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:7px}
.visitbar button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:800;padding:0}

main{padding-block:16px 40px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:.8rem}.tiny{font-size:.7rem}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--honey-strong)}
.sec-title{display:flex;align-items:center;gap:10px}
.sec-title .ico{width:34px;height:34px;border-radius:11px;background:var(--honey-soft);color:var(--honey-strong);display:grid;place-items:center;flex:none}
.sec-title h3{font-size:1.05rem}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:7px 11px;font-weight:700;font-size:.8rem;white-space:nowrap;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{background:var(--sunk);border-color:var(--line-strong)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.honey{background:var(--honey);border-color:var(--honey);color:var(--on-honey)}
.btn.honey:hover{filter:brightness(1.06)}
.btn.dark{background:var(--ink-strong);border-color:var(--ink-strong);color:var(--bg)}
.btn.win{background:var(--win);border-color:var(--win);color:#fff}
.btn.danger{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 35%,var(--line))}
.btn.danger:hover{background:var(--loss-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.wa{background:#25D366;border-color:#25D366;color:#063B1C}
.btn.sm{padding:5px 9px;font-size:.74rem;border-radius:10px}
.btn.icon{padding:6px}
a.btn{text-decoration:none}

/* campos */
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:.72rem;font-weight:800;letter-spacing:.03em;color:var(--muted);text-transform:uppercase}
input[type=text],input[type=number],input[type=search],input[type=url],select,textarea{width:100%;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.88rem}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--honey)}
.search{position:relative;min-width:0}
.search .i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:34px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.seg{display:inline-flex;padding:4px;gap:4px;background:var(--sunk);border-radius:14px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:10px;padding:6px 10px;font-family:var(--f-display);font-weight:600;font-size:.82rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink-strong);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .count{font-family:var(--f-mono);font-size:.68rem;background:var(--honey-soft);color:var(--honey-strong);border-radius:999px;padding:0 6px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;overflow:hidden}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero-l{padding:18px 20px;display:grid;gap:12px;align-content:start;background:linear-gradient(135deg,var(--honey-soft),transparent 60%)}
.hero h1{font-size:clamp(1.35rem,2.4vw,1.8rem);letter-spacing:-.01em}
.hero p.lede{color:var(--muted);max-width:62ch;font-size:.9rem}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
button.metric:hover{border-color:var(--honey)}
.metric .i{color:var(--honey-strong)}
.metric small{display:block;font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.metric strong{font-family:var(--f-display);font-size:.92rem;color:var(--ink-strong)}
.hero-r{position:relative;min-height:210px;background:var(--sunk);border-left:1px solid var(--line)}
@media (max-width:860px){.hero-r{border-left:0;border-top:1px solid var(--line)}}
.hero-r img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-r .shade{position:absolute;inset:auto 0 0 0;padding:14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;display:flex;justify-content:space-between;gap:8px;font-size:.8rem}
.hero-r .tools{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.hero-r .tools .btn{background:rgba(15,23,42,.72);border-color:transparent;color:#fff}
.placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;gap:10px;background-image:var(--comb)}
.placeholder .ring{width:72px;height:72px;border-radius:24px;background:var(--honey-soft);color:var(--honey-strong);display:grid;place-items:center;margin:0 auto}
.drag{outline:3px dashed var(--honey);outline-offset:-10px}

/* abas do torneio */
.tabbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--win-soft);color:var(--win);border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:800}
.live i{width:8px;height:8px;border-radius:50%;background:var(--win);animation:pulse 1.6s infinite}
.live.off{background:var(--sunk);color:var(--muted)}.live.off i{background:var(--faint);animation:none}
@keyframes pulse{50%{opacity:.35}}

/* tabela */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;background:var(--sunk);white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
tr.gold td{background:color-mix(in srgb,var(--honey-soft) 55%,transparent)}
.medal{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;font-family:var(--f-display);font-weight:700;font-size:.9rem;background:var(--sunk);color:var(--muted)}
.medal.g1{background:#FCD34D;color:#5B3A00}.medal.g2{background:#E2E8F0;color:#334155}.medal.g3{background:#FDBA74;color:#5A2600}
.pname{font-weight:800;color:var(--ink-strong)}
.rec .w{color:var(--win);font-weight:800}.rec .l{color:var(--loss);font-weight:800}.rec .d{color:var(--tie);font-weight:800}
.th-btn{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;text-decoration:underline dotted}

/* deck badge (substitui as sprites) */
.deck{display:inline-flex;align-items:center;gap:8px;min-width:0}
.deck .txt{min-width:0}
.deck .txt b{display:block;font-weight:700;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;color:var(--ink)}
.deck .txt small{display:block;font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.hexb{width:34px;height:38px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.72rem;color:#fff;letter-spacing:.02em}
.hexb.xs{width:24px;height:27px;font-size:.55rem}.hexb.lg{width:52px;height:58px;font-size:1rem}.hexb.xl{width:72px;height:80px;font-size:1.3rem}
.hexb img{width:100%;height:100%;object-fit:cover}
.duo{display:inline-flex}.duo .hexb+.hexb{margin-left:-10px}

/* rodadas */
.rbar{display:grid;gap:12px}
.rtabs{display:flex;gap:6px;flex-wrap:wrap}
.rtab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-family:var(--f-display);font-weight:600;font-size:.86rem;display:inline-flex;gap:6px;align-items:center}
.rtab[aria-pressed="true"]{background:var(--ink-strong);color:var(--bg);border-color:var(--ink-strong)}
.rtab .i{color:var(--win)}
.timer{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 12px;position:relative}
.clock{font-family:var(--f-mono);font-weight:700;font-size:1.15rem;min-width:62px}
.clock.low{color:var(--honey-strong)}.clock.over{color:var(--loss)}
.pop{position:absolute;top:calc(100% + 6px);right:0;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;width:230px}
.pop .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.matches{display:grid;gap:12px}
.match{display:grid;gap:10px;padding:12px}
.match.done{background:color-mix(in srgb,var(--surface) 70%,var(--sunk))}
.mgrid{display:grid;grid-template-columns:110px minmax(0,1fr) 84px minmax(0,1fr);gap:12px;align-items:center}
@media (max-width:760px){.mgrid{grid-template-columns:1fr}.mgrid .vs{justify-self:start}}
.mesa{display:grid;gap:4px}
.mesa b{font-family:var(--f-display);font-size:1rem;color:var(--ink-strong)}
.pl{display:flex;align-items:center;gap:10px;min-width:0;padding:8px;border-radius:14px;border:1px solid transparent}
.pl.win{background:var(--win-soft);border-color:color-mix(in srgb,var(--win) 30%,transparent)}
.pl.lose{opacity:.6}
.pl .who{min-width:0;flex:1}
.pl .who b{display:block;font-weight:800;color:var(--ink-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .who small{display:block;font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .acts{display:flex;gap:2px}
.vs{justify-self:center;font-family:var(--f-display);font-weight:700;font-size:.86rem;padding:5px 12px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.vs.w{background:var(--win-soft);color:var(--win)}.vs.d{background:var(--tie-soft);color:var(--tie)}
.report{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:10px}
.report .lbl{font-size:.72rem;font-weight:800;color:var(--muted);margin-right:4px}
.res{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-weight:800;font-size:.76rem;display:inline-flex;gap:5px;align-items:center}
.res:hover{border-color:var(--honey)}
.res[aria-pressed="true"].w{background:var(--win-soft);border-color:var(--win);color:var(--win)}
.res[aria-pressed="true"].d{background:var(--tie-soft);border-color:var(--tie);color:var(--tie)}

/* grades de cartões */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.pcard{padding:14px;display:grid;gap:10px;align-content:start}
.pcard.drop{opacity:.6}
.pcard .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard h4{font-size:1.02rem;overflow:hidden;text-overflow:ellipsis}
.pcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:.76rem;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--honey-soft);color:var(--honey-strong);font-size:.82rem;font-weight:600}

.list{display:grid;gap:8px}

<body>
<div id="app"><div class="wrap" style="padding-block:40px;color:#94A3B8;font-family:system-ui">Carregando HoneyLeague TCG...</div></div>
<div id="modals"></div>
<input type="file" id="file" hidden>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* HoneyLeague TCG — regras do torneio (portadas de src/utils do projeto original). Sem DOM. */
(function (root) {
  "use strict";
  var WIN = 3, DRAW = 1, BYE = 3, MIN_MWP = 0.3333;

  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, r) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function lc(s) { return String(s || "").toLowerCase(); }

  /* Resultado efetivo: oficial do organizador ou, se pendente, o reporte de mesa. */
  function reportKey(roundNumber, matchId) { return String(roundNumber) + "-" + String(matchId).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_"); }
  function effectiveRounds(rounds, reports) {
    reports = reports || {};
    return (rounds || []).map(function (r) {
      var matches = r.matches.map(function (m) {
        if (m.isBye || m.result !== "pending") return m;
        var rep = reports[reportKey(r.roundNumber, m.id)];
        if (rep && rep.result && rep.result !== "pending") return Object.assign({}, m, { result: rep.result, reported: true });
        return m;
      });
      return Object.assign({}, r, { matches: matches, isCompleted: matches.every(function (m) { return m.isBye || m.result !== "pending"; }) });
    });
  }

  /* Classificação: Pontos > OMW% > OOW% > Vitórias > Nome (piso 33,33%). */
  function standings(players, rounds) {
    var st = {};
    players.forEach(function (p) { st[p.id] = { points: 0, wins: 0, draws: 0, losses: 0, byes: 0, matchesPlayed: 0, opponents: [] }; });
    (rounds || []).forEach(function (round) {
      round.matches.forEach(function (m) {
        if (m.result === "pending") return;
        var a = st[m.player1Id]; if (!a) return;
        if (m.isBye || !m.player2Id) { a.points += BYE; a.wins++; a.byes++; a.matchesPlayed++; return; }
        var b = st[m.player2Id]; if (!b) return;
        a.matchesPlayed++; b.matchesPlayed++;
        a.opponents.push(m.player2Id); b.opponents.push(m.player1Id);
        if (m.result === "p1_win" || m.result === "p1_wo") { a.points += WIN; a.wins++; b.losses++; if (m.result === "p1_wo") { a.woWins = (a.woWins || 0) + 1; b.woLosses = (b.woLosses || 0) + 1; } }
        else if (m.result === "p2_win" || m.result === "p2_wo") { b.points += WIN; b.wins++; a.losses++; if (m.result === "p2_wo") { b.woWins = (b.woWins || 0) + 1; a.woLosses = (a.woLosses || 0) + 1; } }
        else if (m.result === "draw") { a.points += DRAW; b.points += DRAW; a.draws++; b.draws++; }
        else if (m.result === "double_loss") { a.losses++; b.losses++; a.dl = (a.dl || 0) + 1; b.dl = (b.dl || 0) + 1; }
      });
    });
    var mwp = {}, omw = {}, oow = {};
    players.forEach(function (p) {
      var s = st[p.id];
      mwp[p.id] = !s.matchesPlayed ? MIN_MWP : Math.max(MIN_MWP, s.points / (s.matchesPlayed * WIN));
    });
    players.forEach(function (p) {
      var o = st[p.id].opponents;
      omw[p.id] = o.length ? o.reduce(function (acc, id) { return acc + (mwp[id] != null ? mwp[id] : MIN_MWP); }, 0) / o.length : MIN_MWP;
    });
    players.forEach(function (p) {
      var o = st[p.id].opponents;
      oow[p.id] = o.length ? o.reduce(function (acc, id) { return acc + (omw[id] != null ? omw[id] : MIN_MWP); }, 0) / o.length : MIN_MWP;
    });
    var rows = players.map(function (p) {
      var s = st[p.id];
      return { rank: 1, player: p, points: s.points, wins: s.wins, draws: s.draws, losses: s.losses, byes: s.byes,
        omw: omw[p.id], oow: oow[p.id], matchesPlayed: s.matchesPlayed, opponents: s.opponents,
        woWins: s.woWins || 0, woLosses: s.woLosses || 0, doubleLosses: s.dl || 0 };
    });
    rows.sort(function (a, b) {
      if (b.points !== a.points) return b.points - a.points;
      if (Math.abs(b.omw - a.omw) > 0.0001) return b.omw - a.omw;
      if (Math.abs(b.oow - a.oow) > 0.0001) return b.oow - a.oow;
      if (b.wins !== a.wins) return b.wins - a.wins;
      return a.player.name.localeCompare(b.player.name, "pt-BR");
    });
    rows.forEach(function (r, i) { r.rank = i + 1; });
    return rows;
  }

  function havePlayed(a, b, rounds) {
    for (var i = 0; i < rounds.length; i++) for (var j = 0; j < rounds[i].matches.length; j++) {
      var m = rounds[i].matches[j];
      if ((m.player1Id === a && m.player2Id === b) || (m.player1Id === b && m.player2Id === a)) return true;
    }
    return false;
  }
  function hasHadBye(id, rounds) {
    return rounds.some(function (r) { return r.matches.some(function (m) { return m.isBye && m.player1Id === id; }); });
  }

  /* Pareamento suíço: por pontos, sorteio dentro do mesmo grupo de pontos, sem revanche. */
  function pairRound(players, rounds, roundNumber, seed) {
    var r = rng(seed == null ? Date.now() : seed);
    var active = players.filter(function (p) { return p.active !== false; });
    if (active.length < 2) throw new Error("É necessário ter pelo menos 2 jogadores ativos.");
    var table = standings(active, rounds);

/* ===== detectar os Pokémon pelo nome do deck ===== */
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  var d = []; for (var i = 0; i <= a.length; i++) { d[i] = [i]; } for (var j = 1; j <= b.length; j++) d[0][j] = j;
  for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) { d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1); }
  return d[a.length][b.length];
}
function detectIcons(arch) {
  var txt = lc(arch).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, "");
  if (!txt.trim() || typeof DEX_NAMES === "undefined") return [];
  var found = [];
  function add(name, pos) { if (!found.some(function (f) { return f.name === name; })) found.push({ name: name, pos: pos }); }
  DEX_NAMES.forEach(function (n) {
    var k = lc(n).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’'.]/g, "");
    if (k.length < 3) return;
    var re = new RegExp("(^|[^a-z])" + k.replace(/[-\s]/g, "[-\\s]?") + "($|[^a-z])"), m = re.exec(txt);
    if (m) add(n, m.index);
  });
  if (found.length < 2) {
    var pos = 0;
    txt.split(/[^a-z]+/).forEach(function (w) {
      pos = txt.indexOf(w, pos);
      if (w.length < 5 || /^(baby|mega|power|hand|festival|lead|inspiration|mysterious|rock|equipe|rocket|esconde|some|turbo|control)$/.test(w)) return;
      if (found.some(function (f) { return lc(f.name) === w; })) return;
      for (var i = 0; i < DEX_NAMES.length; i++) { var k = lc(DEX_NAMES[i]); if (k.length >= 5 && (lev(w, k) <= 1 || (w.length >= 6 && lev(w, k) <= 2 && w[0] === k[0]))) { add(DEX_NAMES[i], pos); break; } }
    });
  }
  found.sort(function (a, b) { return a.pos - b.pos; });
  return found.slice(0, 2).map(function (f) { return f.name; });
}

/* ===== Página: Regras ===== */
function vRules() {

    '<section class="card"><h3>' + ic("trophy") + 'Estrutura do Torneio — Formato Padrão</h3><div class="tbl2"><div><span class="small muted">6 a 16 jogadores</span><b>4 rodadas suíças — MD1</b></div><div><span class="small muted">17 a 32 jogadores</span><b>5 rodadas suíças — MD1</b></div></div>' +
    '<div class="banner">' + ic("clock") + ' Todos os horários seguem o horário de Brasília (Fortaleza/CE), independentemente do estado ou cidade do jogador.</div><p>Cada rodada possui <strong>30 minutos ou 24 horas</strong> de duração, conforme o combinado. Nesse período, os jogadores devem entrar em contato, combinar um horário, realizar a partida e enviar o resultado.</p></section>' +
    '<section class="card"><h3>' + ic("trophy") + 'Formatos de Torneios</h3><h5>Torneios de Código</h5><p>Os jogadores do <strong>Top 3</strong> recebem códigos digitais de acordo com a colocação oficial no torneio.</p><h5>Torneios pagos de booster</h5><p>É cobrado um valor de <strong>4 ou 5 reais</strong> para a compra de triple packs e boosters para premiação do <strong>Top 1 e Top 2</strong>.</p></section>' +
    '<section class="card"><h3>' + ic("clock") + 'Regras de Marcação das Batalhas</h3>' +
    "<h5>1. Prazo da rodada</h5><p>Cada rodada terá <strong>30 minutos ou 24 horas</strong> para ser realizada, a depender do combinado entre a organização e os jogadores. A partida deve acontecer dentro do período da rodada, respeitando o horário oficial informado. Exceções fora do período só valem quando os dois jogadores concordarem previamente.</p>" +
    "<h5>2. Marcação de horário (formato 24h)</h5><p>Para que uma partida seja considerada marcada, os jogadores devem informar horários objetivos e definidos. Não valem expressões como “daqui a pouco”, “mais tarde”, “umas 3 horas”, “3 e pouco” ou “quando eu puder”. Um horário aproximado como “umas 15h” é considerado marcado a partir das <strong>15h01</strong>.</p>" +
    "<h5>3. Regra dos 3 horários</h5><p>Se o jogador não conseguir definir um único horário, deve apresentar <strong>3 opções diferentes</strong>, com pelo menos <strong>1 hora de intervalo</strong> entre elas (ex.: 14h, 15h e 17h), dentro do período da rodada. Se um jogador apresentar três opções válidas e o adversário não oferecer alternativas suficientes, a organização pode considerar isso na análise.</p>" +
    "<h5>4. Comunicação entre os jogadores</h5><p>O jogador deve marcar o adversário no <strong>grupo oficial do WhatsApp</strong> ao tentar combinar a partida. A conversa pode continuar no privado, desde que existam registros quando a organização precisar analisar.</p>" +
    "<h5>5. Horário combinado & tolerância</h5><p>Depois que os dois concordam com um horário, ele passa a ser o horário oficial da partida e só muda com o acordo de ambos. Se um jogador não comparecer, há tolerância de <strong>5 minutos</strong> no formato 30 minutos e <strong>30 minutos</strong> no formato 24 horas.</p>" +
    "<h5>6. Final do prazo da rodada</h5><p>As partidas devem ser concluídas e os resultados enviados dentro do prazo. Se a partida não acontecer por responsabilidade comprovada de apenas um jogador, a organização pode atribuir <strong>WO</strong> a ele. Se a responsabilidade for dos dois, pode aplicar <strong>Double Loss</strong>.</p>" +
    "<h5>7. Inatividade e drop</h5><p>O jogador que ficar duas rodadas sem jogar e sem qualquer comunicação com o adversário ou com a organização pode ser <strong>automaticamente dropado</strong>. A organização pode analisar situações excepcionais antes do drop.</p>" +
    "<h5>8. Ausências recorrentes</h5><p>Se os dois jogadores forem penalizados por ausência ou falta de comunicação em uma rodada e isso se repetir na rodada seguinte, ambos podem ser dropados.</p></section>" +
    '<section class="card"><h3>' + ic("info") + 'Bugs e desconexões</h3><p>Problemas de conexão, queda de internet ou travamentos são, em regra, responsabilidade do jogador afetado.</p><ul><li><strong>Bug no início da partida:</strong> se um bug impedir o início ou o andamento normal, o adversário pode aceitar ou não uma nova partida.</li><li><strong>Bug em momento decisivo:</strong> o jogador pode apresentar print ou vídeo para análise; a vitória só é reconhecida com evidência suficiente.</li></ul></section>' +

    '<section class="card"><h3>' + ic("layers") + 'Deck incorreto e desistência</h3><p>Se o jogador selecionar o deck incorreto, pode <strong>desistir e voltar à partida</strong> para escolher o deck correto no início, sem penalidade.</p></section>' +
    '<section class="card"><h3>' + ic("file") + 'Decklist & penalidades</h3><p>Os jogadores devem usar durante todo o torneio exatamente a mesma decklist informada na inscrição. Se for comprovado o uso de carta fora da lista:</p><ul><li><strong>Formato MD1:</strong> derrota automática na partida.</li><li><strong>Formato MD3:</strong> derrota automática na partida; se houver outra partida na MD3, o adversário escolhe quem começa.</li><li><strong>Reincidência:</strong> se a irregularidade se repetir no mesmo torneio, o jogador é automaticamente dropado.</li></ul></section>' +
    '<section class="card"><h3>1. Sistema Suíço</h3><p>No Sistema Suíço <strong>ninguém é eliminado</strong> ao perder uma partida: todos jogam todas as rodadas programadas.</p><ul><li><strong>Emparceiramento por pontos:</strong> a cada rodada, jogadores com pontuações parecidas se enfrentam. Dentro de cada faixa de pontos, as mesas são sorteadas.</li><li><strong>Sem reencontros:</strong> dois jogadores não se enfrentam duas vezes na fase suíça (só se for matematicamente impossível evitar).</li><li><strong>BYE automático:</strong> com número ímpar de participantes, o jogador de pior colocação que ainda não recebeu BYE ganha uma vitória livre de 3 pontos.</li></ul></section>' +
    '<section class="card"><h3>2. Pontuação das partidas</h3><div class="tbl2"><div><b>3 pontos</b><span class="small muted">Vitória ou BYE</span></div><div><b>1 ponto</b><span class="small muted">Empate (para cada jogador)</span></div><div><b>0 pontos</b><span class="small muted">Derrota</span></div></div></section>' +
    '<section class="card"><h3>3. Critérios de desempate</h3><p>Jogadores com os mesmos pontos são separados, nesta ordem, por:</p><h5>1º · OMW% (Opponent Match Win %)</h5><p>Mede a força dos oponentes que você enfrentou: é a média do aproveitamento de cada oponente (pontos ÷ pontos possíveis). O aproveitamento de cada oponente tem <strong>piso de 33,33%</strong>.</p><h5>2º · OOW% (Opponents’ Opponent Match Win %)</h5><p>Usado se o empate continuar: é a média do OMW% dos seus oponentes.</p><h5>Depois</h5><p>Número de vitórias e, por último, ordem alfabética.</p></section>' +
    '<section class="card"><h3>4. Rodadas recomendadas</h3><div class="tbl2"><div><span class="small muted">até 4 jogadores</span><b>2 rodadas</b></div><div><span class="small muted">5 a 8 jogadores</span><b>3 rodadas</b></div><div><span class="small muted">9 a 16 jogadores</span><b>4 rodadas</b></div><div><span class="small muted">17 a 32 jogadores</span><b>5 rodadas</b></div><div><span class="small muted">33+ jogadores</span><b>6+ rodadas</b></div></div></section>' +
    '<section class="card"><h3>' + ic("shield") + 'Considerações finais</h3><p>A Liga Honey busca manter os torneios organizados, acessíveis e justos para todos. Ao participar, o jogador declara estar ciente e de acordo com estas regras.</p></section></div>';

/* ===== Marcação de horário (regras 2 a 5 do regulamento) ===== */
function fmtWhen(w) {
  var d = new Date(w); if (isNaN(d)) return w;
  return d.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" }).replace(".", "") + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}
function tolerance() { return (S.t.roundDurationMinutes || 30) > 60 ? 30 : 5; }
function canWriteShared() { return isAdmin() || (S.mode === "live" && S.canReport); }
function vSchedule(m, rn, p1, p2) {
  if (m.isBye || rn !== S.t.currentRound || S.t.status === "finished") return "";
  var k = HL.reportKey(rn, m.id), sc = S.schedules[k], can = canWriteShared() && m.result === "pending";
  if (!sc && m.result !== "pending") return "";
  var who = function (side) { return side === "p1" ? p1.name : side === "p2" ? p2.name : "Organizador"; };
  var html = '<div class="report" style="border-top-style:solid">' + ic("clock", "sm");
  if (sc && sc.confirmed) {
    html += '<span class="pill win">Partida marcada: ' + esc(fmtWhen(sc.confirmed.when)) + '</span><span class="tiny muted">Confirmado por ' + esc(who(sc.confirmed.by)) + " · tolerância de " + tolerance() + " min</span>";
  } else if (sc && sc.options && sc.options.length) {
    var other = sc.proposedBy === "p1" ? "p2" : sc.proposedBy === "p2" ? "p1" : null;
    html += '<span class="lbl">' + esc(who(sc.proposedBy)) + " propôs:</span>" + sc.options.map(function (o, i) {
      return can ? '<button class="res" data-a="sch-confirm" data-k="' + esc(k) + '" data-i="' + i + '" data-by="' + (other || "admin") + '" title="Confirmar este horário' + (other ? " como " + esc(who(other)) : "") + '">' + esc(fmtWhen(o.when)) + " ✓</button>" : '<span class="pill">' + esc(fmtWhen(o.when)) + "</span>";
    }).join("") + (can && other ? '<span class="tiny muted">Toque num horário para confirmar como ' + esc(who(other)) + "</span>" : "");

  try { parsed = JSON.parse(await file.text()); } catch (e) { return toast("Arquivo inválido: não é um JSON."); }
  var src = Array.isArray(parsed) ? parsed : parsed && parsed.history && !parsed.champion ? (Array.isArray(parsed.history) ? parsed.history : values(parsed.history)) : [parsed];
  var items = [];
  src.forEach(function (it, i) { if (it && it.champion && Array.isArray(it.standings)) items.push(it); else { var c = tourneyToHistory(it, i); if (c) items.push(c); } });
  if (!items.length) return toast("Nenhum torneio válido no arquivo. Use um backup de torneio ou de histórico do HoneyLeague.");
  toast("Importando " + items.length + " edição(ões)...");
  try {
    for (var i = 0; i < items.length; i++) { var h = await normalizeHistoryItem(items[i]); Store.put("history", h.id, h); }
    recalcLifetime(historyList()); render();
    toast(items.length + " edição(ões) importada(s) para o histórico.");
  } catch (e) { toast("Erro ao importar: " + (e.message || e.code || "falha")); }
}
async function restoreTournament(file) {
  var parsed;
  try { parsed = JSON.parse(await file.text()); } catch (e) { return toast("Arquivo inválido: não é um JSON."); }
  var tsrc = parsed && parsed.tournament ? parsed.tournament : parsed;
  if (!tsrc || !Array.isArray(tsrc.players)) return toast("Arquivo JSON inválido para torneio.");
  confirmBox({ title: "Restaurar este backup?", body: "<p>O torneio atual será substituído por <strong>" + esc(tsrc.title || "sem nome") + "</strong> com " + tsrc.players.length + " jogadores." + (parsed.trainers ? " O banco de treinadores e o histórico do arquivo também serão gravados." : "") + "</p>", ok: "Restaurar", icon: "upload",
    onOk: async function () {
      toast("Restaurando...");
      try {
        var t = Object.assign(blankT(), clone(tsrc));
        for (var i = 0; i < t.players.length; i++) {
          var raw = tsrc.players[i], p = normPlayer(raw);
          if (raw.decklistImage) { var ref = await refFromData(raw.decklistImage); if (ref) Store.put("decks", p.id, Object.assign({ at: Date.now() }, ref)); }
          t.players[i] = p;
        }
        if (tsrc.bannerImage) { t.banner = await refFromData(tsrc.bannerImage); delete t.bannerImage; }
        delete t.whatsappConfig;
        t.updatedAt = Date.now(); Store.saveT(t);
        if (parsed.decks) Object.keys(parsed.decks).forEach(function (k) { Store.put("decks", k, parsed.decks[k]); });
        if (parsed.trainers) values(parsed.trainers).forEach(function (tr) { Store.put("trainers", tr.id, tr); });
        if (parsed.history) values(parsed.history).forEach(function (h) { Store.put("history", h.id, h); });
        if (parsed.settings) Store.saveSettings(Object.assign({}, S.settings, parsed.settings));
        render(); toast("Backup restaurado.");
      } catch (e) { toast("Erro ao restaurar: " + (e.message || e.code)); }
    } });
}

        try { await FB.fs.doc("drops/" + S.player.uid).set({ at: Date.now(), round: S.t.currentRound }); render(); toast("Drop registrado. Boa sorte nas próximas!"); }
        catch (e) { toast("Não foi possível registrar o drop (" + (e.code || e.message) + ")."); }
      } });
  }
});
/* inscrição direta: o botão já confirma a vaga */
var _pfJoin = A["pf-join"];
A["pf-join"] = async function () {
  if (S.drops[S.player && S.player.uid]) { try { await FB.fs.doc("drops/" + S.player.uid).delete(); } catch (e) { } }
  await _pfJoin();
  if (autoOn()) { render(); toast(myTournamentPlayer() ? "Inscrição confirmada! Você está no torneio." : "Vagas esgotadas: você entrou na lista de espera."); }
};
/* reativar pelo organizador também apaga o pedido de drop do jogador */
var _dropToggle = A.drop;
A.drop = function (d) {
  var p = player(d.id), dr = p && dropFor(p);
  if (dr && p.active === false && isAdmin()) { Store.del("drops", p.uid || p.id); if (p.uid && S.drops[p.id]) Store.del("drops", p.id); }
  return _dropToggle(d);
};
/* painel do organizador: com inscrição direta, a lista de pedidos é só a lista de espera */
var _vSignupsAdmin = vSignupsAdmin;
vSignupsAdmin = function () {
  var html = _vSignupsAdmin();
  if (!accountsOn() || !autoOn()) return html;
  html = html.replace('<b>Inscrição pelo link</b>', '<b>Inscrição pelo perfil</b><span class="pill tie">Automática</span>');
  return html.replace(/<span class="pill honey">Dentro das vagas<\/span>/g, '<span class="pill honey">Aguardando vaga</span>');
};
var _settingsModal3 = MODALS.settings;
MODALS.settings = function (m) {
  var html = _settingsModal3(m);
  if (!accountsOn()) return html;
  return html.replace(/(<label class="row small" style="gap:8px"><input type="checkbox" id="s-regopen"[^>]*> Inscrições abertas para os jogadores<\/label>)/,
    '$1<label class="row small" style="gap:8px"><input type="checkbox" id="s-regauto" data-m="regAuto"' + (m.f.regAuto !== false ? " checked" : "") + "> Inscrição automática (sem aprovação) até lotar as vagas</label>");
};
var _settingsSave = A["settings-save"];
A["settings-save"] = function () {
  var m = topModal(), auto = m && m.f ? m.f.regAuto : undefined;
  _settingsSave();
  if (auto !== undefined) Store.saveSettings(Object.assign({}, S.settings, { regAuto: auto !== false }));
};
var _settingsOpen = A.settings;
A.settings = function () { _settingsOpen(); var m = topModal(); if (m && m.type === "settings") m.f.regAuto = S.settings.regAuto !== false; renderModals(); };
PAGE_VIEWS.perfil = vProfile;

function ownsPlayer(p) { return !!(p && S.player && (p.id === S.player.uid || p.uid === S.player.uid)); }

/* início */
applyTheme();
render();
(window.FIREBASE_CONFIG && window.firebase ? connectFirebase : connect)();

})();
</script>
</body>
</html>
